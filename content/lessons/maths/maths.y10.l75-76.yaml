id: maths.y10.l75-76
subject: maths
year: 10
block: geometry
blockTitle: Graphs, Geometry, Shapes and Functions
lessonUnits: 75-76
examBoard: Edexcel
title: Properties of 3D Shapes
lessonsPerWeek: 2
unitAim: Understand faces, edges, and vertices of 3D shapes.
objectives:
  - Identify 3D properties
  - Use nets
  - Solve 3D problems
sections:
  - type: connect
    title: Connect to your lesson
    items:
      - type: info
        id: m107576-c1
        prompt: What we covered in your Purple Ruler lesson
        content: >-
          Lessons 75-76 cover Properties of 3D Shapes. Understand faces, edges, and vertices of 3D shapes. Use this
          workbook after your live lesson to practise and check your understanding.
  - type: practice
    title: Practice
    items:
      - type: mcq
        id: m107576-p1
        prompt: Which aim best describes "Properties of 3D Shapes"?
        options:
          - Identify 3D properties
          - Ignore units and notation
          - Guess without showing working
          - Skip checking answers
        answer: Identify 3D properties
      - type: numeric
        id: m107576-p2
        prompt: 'Calculate: 3/4 + 1/8 (give as a decimal).'
        answer: 0.875
        explanation: 3/4 = 0.75; 0.75 + 0.125 = 0.875
      - type: mcq
        id: m107576-p3
        prompt: 'When solving GCSE maths problems, you should:'
        options:
          - Show clear working and check the answer
          - Hide all working from the examiner
          - Never include units
          - Skip reading the question
        answer: Show clear working and check the answer
      - type: numeric
        id: m107576-p4
        prompt: 'Simplify: 4x + 3x - 2 (give the coefficient of x as a number, e.g. if answer is 7x-2 write 7).'
        answer: 7
        explanation: 4x + 3x = 7x, so coefficient is 7
  - type: check
    title: Check your understanding
    items:
      - type: mcq
        id: m107576-ch1
        prompt: Which skill is central to Properties of 3D Shapes?
        options:
          - Identify 3D properties
          - Rounding every answer to the nearest 10 only
          - Using the wrong formula deliberately
          - Avoiding diagrams completely
        answer: Identify 3D properties
      - type: numeric
        id: m107576-ch2
        prompt: What is 15% of 80?
        answer: 12
      - type: numeric
        id: m107576-ch3
        prompt: 'Solve: 2x + 5 = 17. What is x?'
        answer: 6
  - type: reflect
    title: Reflect
    items:
      - type: short_text
        id: m107576-rf1
        prompt: >-
          Explain in one sentence what was challenging in Properties of 3D Shapes and how you overcame it (or will next
          time).
        keywords:
          - practice
          - method
          - working
          - check
          - formula
          - mistake
          - help
        exemplar: >-
          I found choosing the correct method hardest, so I will write a short plan before calculating and check units
          at the end.
  - type: stretch
    title: Stretch
    items:
      - type: numeric
        id: m107576-st1
        prompt: 'Stretch: A rectangle has perimeter 30 cm and length 9 cm. What is its width in cm?'
        answer: 6
        explanation: Perimeter = 2(l + w); 30 = 2(9 + w); 15 = 9 + w; w = 6
