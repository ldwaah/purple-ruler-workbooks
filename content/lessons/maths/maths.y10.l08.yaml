id: maths.y10.l08
subject: maths
year: 10
block: number
blockTitle: Number
lessonUnits: '8'
examBoard: Edexcel
title: Powers of Integers
lessonsPerWeek: 2
unitAim: Identify and use powers in calculations.
objectives:
  - Identify common powers
  - Use powers in problems
  - Avoid common misconceptions
sections:
  - type: connect
    title: Connect to your lesson
    items:
      - type: info
        id: m108-c1
        prompt: What we covered in your Purple Ruler lesson
        content: >-
          Lessons 8 cover Powers of Integers. Identify and use powers in calculations. Use this workbook after your live
          lesson to practise and check your understanding.
  - type: practice
    title: Practice
    items:
      - type: mcq
        id: m108-p1
        prompt: Which aim best describes "Powers of Integers"?
        options:
          - Identify common powers
          - Ignore units and notation
          - Guess without showing working
          - Skip checking answers
        answer: Identify common powers
      - type: numeric
        id: m108-p2
        prompt: 'Calculate: 3/4 + 1/8 (give as a decimal).'
        answer: 0.875
        explanation: 3/4 = 0.75; 0.75 + 0.125 = 0.875
      - type: mcq
        id: m108-p3
        prompt: 'When solving GCSE maths problems, you should:'
        options:
          - Show clear working and check the answer
          - Hide all working from the examiner
          - Never include units
          - Skip reading the question
        answer: Show clear working and check the answer
      - type: numeric
        id: m108-p4
        prompt: 'Simplify: 4x + 3x - 2 (give the coefficient of x as a number, e.g. if answer is 7x-2 write 7).'
        answer: 7
        explanation: 4x + 3x = 7x, so coefficient is 7
  - type: check
    title: Check your understanding
    items:
      - type: mcq
        id: m108-ch1
        prompt: Which skill is central to Powers of Integers?
        options:
          - Identify common powers
          - Rounding every answer to the nearest 10 only
          - Using the wrong formula deliberately
          - Avoiding diagrams completely
        answer: Identify common powers
      - type: numeric
        id: m108-ch2
        prompt: What is 15% of 80?
        answer: 12
      - type: numeric
        id: m108-ch3
        prompt: 'Solve: 2x + 5 = 17. What is x?'
        answer: 6
  - type: reflect
    title: Reflect
    items:
      - type: short_text
        id: m108-rf1
        prompt: >-
          Explain in one sentence what was challenging in Powers of Integers and how you overcame it (or will next
          time).
        keywords:
          - practice
          - method
          - working
          - check
          - formula
          - mistake
          - help
        exemplar: >-
          I found choosing the correct method hardest, so I will write a short plan before calculating and check units
          at the end.
  - type: stretch
    title: Stretch
    items:
      - type: numeric
        id: m108-st1
        prompt: 'Stretch: A rectangle has perimeter 30 cm and length 9 cm. What is its width in cm?'
        answer: 6
        explanation: Perimeter = 2(l + w); 30 = 2(9 + w); 15 = 9 + w; w = 6
