id: maths.y11.l36
subject: maths
year: 11
block: algebra-y11
blockTitle: Algebra
lessonUnits: '36'
examBoard: Edexcel
title: Simultaneous Equations (Advanced)
lessonsPerWeek: 2
unitAim: Solve simultaneous equations including one linear and one quadratic.
objectives:
  - Solve simultaneous equations algebraically
  - Solve one linear and one quadratic equation simultaneously
  - Interpret solutions graphically
sections:
  - type: connect
    title: Connect to your lesson
    items:
      - type: info
        id: m1116-c1
        prompt: What we covered in your Purple Ruler lesson
        content: >-
          Lesson 36 focused on Simultaneous Equations (Advanced). You practised skills from Algebra
          and applied them to GCSE-style questions. Use this workbook after your live lesson to
          strengthen your understanding.
  - type: practice
    title: Practice
    items:
      - type: mcq
        id: m1116-p1
        prompt: Which habit helps you succeed in Lesson 36?
        options:
          - Show clear working for each step
          - Guess without checking
          - Skip units in calculations
          - Avoid revising methods
        answer: Show clear working for each step
      - type: numeric
        id: m1116-p2
        prompt: Calculate 15% of 80
        answer: 12
        explanation: 15% of 80 = 0.15 × 80 = 12
      - type: mcq
        id: m1116-p3
        prompt: Which value is equal to 3/4?
        options:
          - '0.34'
          - '0.75'
          - '0.43'
          - '7.5'
        answer: '0.75'
      - type: ordering
        id: m1116-p4
        prompt: 'Order these problem-solving steps:'
        options:
          - Read the question carefully
          - Choose a method
          - Show working
          - Check the answer
        answer:
          - Read the question carefully
          - Choose a method
          - Show working
          - Check the answer
  - type: check
    title: Check your understanding
    items:
      - type: numeric
        id: m1116-ch1
        prompt: 'Simplify: 4x + 3x'
        answer: 7x
      - type: mcq
        id: m1116-ch2
        prompt: Which symbol makes this true? -2 ___ -5
        options:
          - '>'
          - <
          - '='
          - ≥
        answer: '>'
        explanation: '-2 is greater than -5 on a number line.'
      - type: numeric
        id: m1116-ch3
        prompt: Calculate 2.5 × 4
        answer: 10
        tolerance: 0.01
  - type: reflect
    title: Reflect
    items:
      - type: short_text
        id: m1116-rf1
        prompt: Name one skill from "Simultaneous Equations (Advanced)" you will practise again.
        keywords:
          - method
          - working
          - formula
          - check
          - practice
          - accuracy
        exemplar: Solve simultaneous equations algebraically
  - type: stretch
    title: Stretch
    items:
      - type: numeric
        id: m1116-st1
        prompt: A shirt costs £24. Find the price after a 15% increase.
        answer: 27.6
        tolerance: 0.1
        explanation: Increase = 24 × 0.15 = 3.6, new price = 27.6
