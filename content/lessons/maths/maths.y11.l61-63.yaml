id: maths.y11.l61-63
subject: maths
year: 11
block: revision
blockTitle: Revision
lessonUnits: 61-63
examBoard: Edexcel
title: Exam Technique and Practice Papers
lessonsPerWeek: 2
unitAim: Develop exam technique through practice papers and targeted revision.
objectives:
  - Complete practice papers under timed conditions
  - Review answers and identify areas for improvement
  - Apply exam strategies for different question types
sections:
  - type: connect
    title: Connect to your lesson
    items:
      - type: info
        id: m1125-c1
        prompt: What we covered in your Purple Ruler lesson
        content: >-
          Lesson 61-63 focused on Exam Technique and Practice Papers. You practised skills from
          Revision and applied them to GCSE-style questions. Use this workbook after your live
          lesson to strengthen your understanding.
  - type: practice
    title: Practice
    items:
      - type: mcq
        id: m1125-p1
        prompt: Which habit helps you succeed in Lesson 61-63?
        options:
          - Show clear working for each step
          - Guess without checking
          - Skip units in calculations
          - Avoid revising methods
        answer: Show clear working for each step
      - type: numeric
        id: m1125-p2
        prompt: Calculate 15% of 80
        answer: 12
        explanation: 15% of 80 = 0.15 × 80 = 12
      - type: mcq
        id: m1125-p3
        prompt: Which value is equal to 3/4?
        options:
          - '0.34'
          - '0.75'
          - '0.43'
          - '7.5'
        answer: '0.75'
      - type: ordering
        id: m1125-p4
        prompt: 'Order these problem-solving steps:'
        options:
          - Read the question carefully
          - Choose a method
          - Show working
          - Check the answer
        answer:
          - Read the question carefully
          - Choose a method
          - Show working
          - Check the answer
  - type: check
    title: Check your understanding
    items:
      - type: numeric
        id: m1125-ch1
        prompt: 'Simplify: 4x + 3x'
        answer: 7x
      - type: mcq
        id: m1125-ch2
        prompt: Which symbol makes this true? -2 ___ -5
        options:
          - '>'
          - <
          - '='
          - ≥
        answer: '>'
        explanation: '-2 is greater than -5 on a number line.'
      - type: numeric
        id: m1125-ch3
        prompt: Calculate 2.5 × 4
        answer: 10
        tolerance: 0.01
  - type: reflect
    title: Reflect
    items:
      - type: short_text
        id: m1125-rf1
        prompt: Name one skill from "Exam Technique and Practice Papers" you will practise again.
        keywords:
          - method
          - working
          - formula
          - check
          - practice
          - accuracy
        exemplar: Complete practice papers under timed conditions
  - type: stretch
    title: Stretch
    items:
      - type: numeric
        id: m1125-st1
        prompt: A shirt costs £24. Find the price after a 15% increase.
        answer: 27.6
        tolerance: 0.1
        explanation: Increase = 24 × 0.15 = 3.6, new price = 27.6
