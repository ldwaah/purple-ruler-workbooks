id: english.y10.l26-27
subject: english
year: 10
block: poetry
blockTitle: Power and Conflict Poetry
lessonUnits: 26-27
examBoard: AQA
title: Comparative Analysis of Poems
lessonsPerWeek: 3
unitAim: Develop comparative analysis skills by examining two or more poems.
objectives:
  - Compare themes, language, and structure of two poems
  - Write comparative analysis using a structured approach
  - Discuss similarities and differences in poets' techniques
sections:
  - type: connect
    title: Connect to your lesson
    items:
      - type: info
        id: en1018-c1
        prompt: What we covered in your Purple Ruler lesson
        content: >-
          Lesson 26-27 focused on comparative analysis of poems. You explored key ideas from Power
          and Conflict Poetry and built skills linked to your GCSE English objectives. Use this
          workbook after your live lesson to consolidate that learning.
  - type: practice
    title: Practice
    items:
      - type: mcq
        id: en1018-p1
        prompt: Which objective best matches Lesson 26-27?
        options:
          - Compare themes, language, and structure of two poems
          - Memorise dates only without analysis
          - Ignore context when writing about texts
          - Skip planning before extended writing
        answer: Compare themes, language, and structure of two poems
        scaffold: Choose the aim that matches what you practised in the live lesson.
      - type: short_text
        id: en1018-p2
        prompt: In one or two sentences, explain a key idea from "Comparative Analysis of Poems".
        keywords:
          - understand
          - analyse
          - explain
          - context
          - theme
          - character
          - language
          - structure
        exemplar: Compare themes, language, and structure of two poems
      - type: ordering
        id: en1018-p3
        prompt: 'Order these study skills from first step to final step:'
        options:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
        answer:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
      - type: mcq
        id: en1018-p4
        prompt: Which skill is most important for Power work in this unit?
        options:
          - Using evidence to support ideas
          - Ignoring the question focus
          - Copying text without comment
          - Avoiding subject terminology
        answer: Using evidence to support ideas
  - type: check
    title: Check your understanding
    items:
      - type: multi_select
        id: en1018-ch1
        prompt: 'Select ALL habits that strengthen GCSE English responses:'
        options:
          - Clear topic sentences
          - Evidence from the text
          - Ignoring the question
          - Checking for accurate terminology
        answer:
          - Clear topic sentences
          - Evidence from the text
          - Checking for accurate terminology
      - type: short_text
        id: en1018-ch2
        prompt: Name one subject term you should use when writing about this unit.
        keywords:
          - context
          - theme
          - structure
          - language
          - audience
          - purpose
          - character
          - analysis
        exemplar: Use precise terminology such as context, theme, or structure.
      - type: mcq
        id: en1018-ch3
        prompt: What should you do first when answering an extended question?
        options:
          - Plan your main points
          - Write the conclusion first
          - Copy the question as your answer
          - Skip reading the text
        answer: Plan your main points
  - type: reflect
    title: Reflect
    items:
      - type: long_text
        id: en1018-rf1
        prompt: Write a short paragraph (about 40-60 words) explaining what you learned in Lesson 26-27.
        scaffold: In Lesson 26-27, I learned that...
        checklist:
          - I stated the main idea from the lesson
          - I used at least one piece of subject terminology
          - I linked my learning to the unit aim
        exemplar: Develop comparative analysis skills by examining two or more poems.
        minWords: 30
  - type: stretch
    title: Stretch
    items:
      - type: long_text
        id: en1018-st1
        prompt: >-
          Evaluate how confident you feel about "Comparative Analysis of Poems" and what you will
          revise next. (50-70 words)
        checklist:
          - I identified one strength
          - I identified one area to improve
          - I suggested a specific next step
        minWords: 40
