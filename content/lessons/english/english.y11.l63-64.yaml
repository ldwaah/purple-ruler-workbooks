id: english.y11.l63-64
subject: english
year: 11
block: exam-focus
blockTitle: Literature and Language Exam Focus
lessonUnits: 63-64
examBoard: AQA
title: Further Practice Papers
lessonsPerWeek: 3
unitAim: Continue timed practice of past papers.
objectives:
  - Apply exam strategies
  - Improve timing
  - Reflect on progress
sections:
  - type: connect
    title: Connect to your lesson
    items:
      - type: info
        id: en116364-c1
        prompt: What we covered in your Purple Ruler lesson
        content: >-
          Lessons 63-64 focus on Further Practice Papers. Continue timed practice of past papers. Use this workbook
          after your live lesson to consolidate that learning.
  - type: practice
    title: Practice
    items:
      - type: mcq
        id: en116364-p1
        prompt: Which statement best matches the focus of "Further Practice Papers"?
        options:
          - Apply exam strategies
          - Memorising quotations without analysis
          - Ignoring historical and social context
          - Writing without planning or evidence
        answer: Apply exam strategies
        scaffold: Think back to your lesson objectives and key terminology.
      - type: short_text
        id: en116364-p2
        prompt: In one or two sentences, explain a key idea from Further Practice Papers.
        keywords:
          - further
          - practice
          - papers
        scaffold: A key idea from Further Practice Papers is...
        exemplar: Apply exam strategies. This helps you analyse the text with clear, supported ideas.
      - type: mcq
        id: en116364-p3
        prompt: Which skill is most important for GCSE English success in this unit?
        options:
          - Using evidence and subject terminology
          - Copying the plot with no analysis
          - Avoiding context completely
          - Writing without checking accuracy
        answer: Using evidence and subject terminology
      - type: ordering
        id: en116364-p4
        prompt: 'Put these steps for a strong analytical paragraph in the best order:'
        options:
          - State a clear point linked to the question
          - Select a relevant quotation or reference
          - Explain the writer's method and effect
          - Link back to the question or theme
        answer:
          - State a clear point linked to the question
          - Select a relevant quotation or reference
          - Explain the writer's method and effect
          - Link back to the question or theme
  - type: check
    title: Check your understanding
    items:
      - type: multi_select
        id: en116364-ch1
        prompt: 'Select ALL objectives linked to Further Practice Papers:'
        options:
          - Apply exam strategies
          - Improve timing
          - Reflect on progress
          - Ignore audience and purpose
          - Skip planning entirely
        answer:
          - Apply exam strategies
          - Improve timing
          - Reflect on progress
      - type: short_text
        id: en116364-ch2
        prompt: Name one subject term you should use when writing about this unit.
        keywords:
          - context
          - theme
          - method
          - structure
          - language
          - audience
          - purpose
          - character
        exemplar: Use terms such as context, theme, structure, or writer's methods with precise evidence.
      - type: mcq
        id: en116364-ch3
        prompt: 'After your live lesson, this workbook helps you to:'
        options:
          - Consolidate and practise what you learned
          - Replace all reading of the set texts
          - Skip reflection on your work
          - Avoid using feedback from teachers
        answer: Consolidate and practise what you learned
  - type: reflect
    title: Reflect
    items:
      - type: long_text
        id: en116364-rf1
        prompt: >-
          Write about 40-60 words: what did you learn in Further Practice Papers, and what do you still need to
          practise?
        scaffold: In Further Practice Papers, I learned... I still need to practise...
        checklist:
          - I named a specific skill or idea from the lesson
          - I gave an example from the text or task
          - I identified one next step for improvement
        minWords: 30
        exemplar: >-
          In Further Practice Papers, I learned how to link context to the writer's purpose. I still need to practise
          selecting shorter, sharper quotations and explaining their effect in more detail.
  - type: stretch
    title: Stretch
    items:
      - type: long_text
        id: en116364-st1
        prompt: 'Stretch: write 50-80 words comparing two ideas from Further Practice Papers. Which is more convincing and why?'
        checklist:
          - Clear comparison between two ideas
          - Evidence or example from the unit
          - Evaluative judgement with justification
        minWords: 45
        exemplar: >-
          Both ideas are important, but linking context to theme is more convincing because it shows why the writer made
          choices for a real audience, not only what happens in the plot.
