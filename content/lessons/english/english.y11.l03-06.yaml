id: english.y11.l03-06
subject: english
year: 11
block: christmas-carol
blockTitle: 'A Christmas Carol and Language: Paper 2 Skills'
lessonUnits: 3-6
examBoard: AQA
title: Character Analysis
lessonsPerWeek: 3
unitAim: Detailed study of key characters in A Christmas Carol.
objectives:
  - Examine Scrooge's character arc from miser to benevolent figure
  - Analyse Bob Cratchit and the significance of Tiny Tim
  - Study the three spirits and Jacob Marley
sections:
  - type: connect
    title: Connect to your lesson
    items:
      - type: info
        id: en1102-c1
        prompt: What we covered in your Purple Ruler lesson
        content: >-
          Lesson 3-6 focused on character analysis. You explored key ideas from A Christmas Carol
          and Language: Paper 2 Skills and built skills linked to your GCSE English objectives. Use
          this workbook after your live lesson to consolidate that learning.
  - type: practice
    title: Practice
    items:
      - type: mcq
        id: en1102-p1
        prompt: Which objective best matches Lesson 3-6?
        options:
          - Examine Scrooge's character arc from miser to benevolent figure
          - Memorise dates only without analysis
          - Ignore context when writing about texts
          - Skip planning before extended writing
        answer: Examine Scrooge's character arc from miser to benevolent figure
        scaffold: Choose the aim that matches what you practised in the live lesson.
      - type: short_text
        id: en1102-p2
        prompt: In one or two sentences, explain a key idea from "Character Analysis".
        keywords:
          - understand
          - analyse
          - explain
          - context
          - theme
          - character
          - language
          - structure
        exemplar: Examine Scrooge's character arc from miser to benevolent figure
      - type: ordering
        id: en1102-p3
        prompt: 'Order these study skills from first step to final step:'
        options:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
        answer:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
      - type: mcq
        id: en1102-p4
        prompt: Which skill is most important for A work in this unit?
        options:
          - Using evidence to support ideas
          - Ignoring the question focus
          - Copying text without comment
          - Avoiding subject terminology
        answer: Using evidence to support ideas
  - type: check
    title: Check your understanding
    items:
      - type: multi_select
        id: en1102-ch1
        prompt: 'Select ALL habits that strengthen GCSE English responses:'
        options:
          - Clear topic sentences
          - Evidence from the text
          - Ignoring the question
          - Checking for accurate terminology
        answer:
          - Clear topic sentences
          - Evidence from the text
          - Checking for accurate terminology
      - type: short_text
        id: en1102-ch2
        prompt: Name one subject term you should use when writing about this unit.
        keywords:
          - context
          - theme
          - structure
          - language
          - audience
          - purpose
          - character
          - analysis
        exemplar: Use precise terminology such as context, theme, or structure.
      - type: mcq
        id: en1102-ch3
        prompt: What should you do first when answering an extended question?
        options:
          - Plan your main points
          - Write the conclusion first
          - Copy the question as your answer
          - Skip reading the text
        answer: Plan your main points
  - type: reflect
    title: Reflect
    items:
      - type: long_text
        id: en1102-rf1
        prompt: Write a short paragraph (about 40-60 words) explaining what you learned in Lesson 3-6.
        scaffold: In Lesson 3-6, I learned that...
        checklist:
          - I stated the main idea from the lesson
          - I used at least one piece of subject terminology
          - I linked my learning to the unit aim
        exemplar: Detailed study of key characters in A Christmas Carol.
        minWords: 30
  - type: stretch
    title: Stretch
    items:
      - type: long_text
        id: en1102-st1
        prompt: >-
          Evaluate how confident you feel about "Character Analysis" and what you will revise next.
          (50-70 words)
        checklist:
          - I identified one strength
          - I identified one area to improve
          - I suggested a specific next step
        minWords: 40
