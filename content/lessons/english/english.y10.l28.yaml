id: english.y10.l28
subject: english
year: 10
block: poetry
blockTitle: Power and Conflict Poetry
lessonUnits: '28'
examBoard: AQA
title: Contextual and Thematic Links
lessonsPerWeek: 3
unitAim: Understand the historical and cultural context of poems and identify thematic links.
objectives:
  - Research historical and cultural background of poems
  - Identify thematic links across the anthology
  - Present findings linking context to meaning
sections:
  - type: connect
    title: Connect to your lesson
    items:
      - type: info
        id: en1019-c1
        prompt: What we covered in your Purple Ruler lesson
        content: >-
          Lesson 28 focused on contextual and thematic links. You explored key ideas from Power and
          Conflict Poetry and built skills linked to your GCSE English objectives. Use this workbook
          after your live lesson to consolidate that learning.
  - type: practice
    title: Practice
    items:
      - type: mcq
        id: en1019-p1
        prompt: Which objective best matches Lesson 28?
        options:
          - Research historical and cultural background of poems
          - Memorise dates only without analysis
          - Ignore context when writing about texts
          - Skip planning before extended writing
        answer: Research historical and cultural background of poems
        scaffold: Choose the aim that matches what you practised in the live lesson.
      - type: short_text
        id: en1019-p2
        prompt: In one or two sentences, explain a key idea from "Contextual and Thematic Links".
        keywords:
          - understand
          - analyse
          - explain
          - context
          - theme
          - character
          - language
          - structure
        exemplar: Research historical and cultural background of poems
      - type: ordering
        id: en1019-p3
        prompt: 'Order these study skills from first step to final step:'
        options:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
        answer:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
      - type: mcq
        id: en1019-p4
        prompt: Which skill is most important for Power work in this unit?
        options:
          - Using evidence to support ideas
          - Ignoring the question focus
          - Copying text without comment
          - Avoiding subject terminology
        answer: Using evidence to support ideas
  - type: check
    title: Check your understanding
    items:
      - type: multi_select
        id: en1019-ch1
        prompt: 'Select ALL habits that strengthen GCSE English responses:'
        options:
          - Clear topic sentences
          - Evidence from the text
          - Ignoring the question
          - Checking for accurate terminology
        answer:
          - Clear topic sentences
          - Evidence from the text
          - Checking for accurate terminology
      - type: short_text
        id: en1019-ch2
        prompt: Name one subject term you should use when writing about this unit.
        keywords:
          - context
          - theme
          - structure
          - language
          - audience
          - purpose
          - character
          - analysis
        exemplar: Use precise terminology such as context, theme, or structure.
      - type: mcq
        id: en1019-ch3
        prompt: What should you do first when answering an extended question?
        options:
          - Plan your main points
          - Write the conclusion first
          - Copy the question as your answer
          - Skip reading the text
        answer: Plan your main points
  - type: reflect
    title: Reflect
    items:
      - type: long_text
        id: en1019-rf1
        prompt: Write a short paragraph (about 40-60 words) explaining what you learned in Lesson 28.
        scaffold: In Lesson 28, I learned that...
        checklist:
          - I stated the main idea from the lesson
          - I used at least one piece of subject terminology
          - I linked my learning to the unit aim
        exemplar: Understand the historical and cultural context of poems and identify thematic links.
        minWords: 30
  - type: stretch
    title: Stretch
    items:
      - type: long_text
        id: en1019-st1
        prompt: >-
          Evaluate how confident you feel about "Contextual and Thematic Links" and what you will
          revise next. (50-70 words)
        checklist:
          - I identified one strength
          - I identified one area to improve
          - I suggested a specific next step
        minWords: 40
