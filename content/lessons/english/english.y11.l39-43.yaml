id: english.y11.l39-43
subject: english
year: 11
block: creative-reading
blockTitle: Explorations in Creative Reading and Writing
lessonUnits: 39-43
examBoard: AQA
title: Narrative Structure Analysis
lessonsPerWeek: 3
unitAim: Understanding and analysing narrative structures in fiction.
objectives:
  - 'Identify key narrative elements: plot, character, setting'
  - Analyse plot components from exposition to resolution
  - Examine setting, atmosphere, and point of view
sections:
  - type: connect
    title: Connect to your lesson
    items:
      - type: info
        id: en1116-c1
        prompt: What we covered in your Purple Ruler lesson
        content: >-
          Lesson 39-43 focused on narrative structure analysis. You explored key ideas from
          Explorations in Creative Reading and Writing and built skills linked to your GCSE English
          objectives. Use this workbook after your live lesson to consolidate that learning.
  - type: practice
    title: Practice
    items:
      - type: mcq
        id: en1116-p1
        prompt: Which objective best matches Lesson 39-43?
        options:
          - 'Identify key narrative elements: plot, character, setting'
          - Memorise dates only without analysis
          - Ignore context when writing about texts
          - Skip planning before extended writing
        answer: 'Identify key narrative elements: plot, character, setting'
        scaffold: Choose the aim that matches what you practised in the live lesson.
      - type: short_text
        id: en1116-p2
        prompt: In one or two sentences, explain a key idea from "Narrative Structure Analysis".
        keywords:
          - understand
          - analyse
          - explain
          - context
          - theme
          - character
          - language
          - structure
        exemplar: 'Identify key narrative elements: plot, character, setting'
      - type: ordering
        id: en1116-p3
        prompt: 'Order these study skills from first step to final step:'
        options:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
        answer:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
      - type: mcq
        id: en1116-p4
        prompt: Which skill is most important for Explorations work in this unit?
        options:
          - Using evidence to support ideas
          - Ignoring the question focus
          - Copying text without comment
          - Avoiding subject terminology
        answer: Using evidence to support ideas
  - type: check
    title: Check your understanding
    items:
      - type: multi_select
        id: en1116-ch1
        prompt: 'Select ALL habits that strengthen GCSE English responses:'
        options:
          - Clear topic sentences
          - Evidence from the text
          - Ignoring the question
          - Checking for accurate terminology
        answer:
          - Clear topic sentences
          - Evidence from the text
          - Checking for accurate terminology
      - type: short_text
        id: en1116-ch2
        prompt: Name one subject term you should use when writing about this unit.
        keywords:
          - context
          - theme
          - structure
          - language
          - audience
          - purpose
          - character
          - analysis
        exemplar: Use precise terminology such as context, theme, or structure.
      - type: mcq
        id: en1116-ch3
        prompt: What should you do first when answering an extended question?
        options:
          - Plan your main points
          - Write the conclusion first
          - Copy the question as your answer
          - Skip reading the text
        answer: Plan your main points
  - type: reflect
    title: Reflect
    items:
      - type: long_text
        id: en1116-rf1
        prompt: Write a short paragraph (about 40-60 words) explaining what you learned in Lesson 39-43.
        scaffold: In Lesson 39-43, I learned that...
        checklist:
          - I stated the main idea from the lesson
          - I used at least one piece of subject terminology
          - I linked my learning to the unit aim
        exemplar: Understanding and analysing narrative structures in fiction.
        minWords: 30
  - type: stretch
    title: Stretch
    items:
      - type: long_text
        id: en1116-st1
        prompt: >-
          Evaluate how confident you feel about "Narrative Structure Analysis" and what you will
          revise next. (50-70 words)
        checklist:
          - I identified one strength
          - I identified one area to improve
          - I suggested a specific next step
        minWords: 40
