id: english.y10.l57-58
subject: english
year: 10
block: macbeth-paper2
blockTitle: Macbeth and Paper 2 Language Skills
lessonUnits: 57-58
examBoard: AQA
title: Macbeth Act 1 Analysis
lessonsPerWeek: 3
unitAim: Analyse the key events and characters introduced in Act 1.
objectives:
  - Analyse key events and characters in Act 1
  - Discuss character motivations and decisions
  - Create a timeline of Act 1 events and their consequences
sections:
  - type: connect
    title: Connect to your lesson
    items:
      - type: info
        id: en1036-c1
        prompt: What we covered in your Purple Ruler lesson
        content: >-
          Lesson 57-58 focused on macbeth act 1 analysis. You explored key ideas from Macbeth and
          Paper 2 Language Skills and built skills linked to your GCSE English objectives. Use this
          workbook after your live lesson to consolidate that learning.
  - type: practice
    title: Practice
    items:
      - type: mcq
        id: en1036-p1
        prompt: Which objective best matches Lesson 57-58?
        options:
          - Analyse key events and characters in Act 1
          - Memorise dates only without analysis
          - Ignore context when writing about texts
          - Skip planning before extended writing
        answer: Analyse key events and characters in Act 1
        scaffold: Choose the aim that matches what you practised in the live lesson.
      - type: short_text
        id: en1036-p2
        prompt: In one or two sentences, explain a key idea from "Macbeth Act 1 Analysis".
        keywords:
          - understand
          - analyse
          - explain
          - context
          - theme
          - character
          - language
          - structure
        exemplar: Analyse key events and characters in Act 1
      - type: ordering
        id: en1036-p3
        prompt: 'Order these study skills from first step to final step:'
        options:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
        answer:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
      - type: mcq
        id: en1036-p4
        prompt: Which skill is most important for Macbeth work in this unit?
        options:
          - Using evidence to support ideas
          - Ignoring the question focus
          - Copying text without comment
          - Avoiding subject terminology
        answer: Using evidence to support ideas
  - type: check
    title: Check your understanding
    items:
      - type: multi_select
        id: en1036-ch1
        prompt: 'Select ALL habits that strengthen GCSE English responses:'
        options:
          - Clear topic sentences
          - Evidence from the text
          - Ignoring the question
          - Checking for accurate terminology
        answer:
          - Clear topic sentences
          - Evidence from the text
          - Checking for accurate terminology
      - type: short_text
        id: en1036-ch2
        prompt: Name one subject term you should use when writing about this unit.
        keywords:
          - context
          - theme
          - structure
          - language
          - audience
          - purpose
          - character
          - analysis
        exemplar: Use precise terminology such as context, theme, or structure.
      - type: mcq
        id: en1036-ch3
        prompt: What should you do first when answering an extended question?
        options:
          - Plan your main points
          - Write the conclusion first
          - Copy the question as your answer
          - Skip reading the text
        answer: Plan your main points
  - type: reflect
    title: Reflect
    items:
      - type: long_text
        id: en1036-rf1
        prompt: Write a short paragraph (about 40-60 words) explaining what you learned in Lesson 57-58.
        scaffold: In Lesson 57-58, I learned that...
        checklist:
          - I stated the main idea from the lesson
          - I used at least one piece of subject terminology
          - I linked my learning to the unit aim
        exemplar: Analyse the key events and characters introduced in Act 1.
        minWords: 30
  - type: stretch
    title: Stretch
    items:
      - type: long_text
        id: en1036-st1
        prompt: >-
          Evaluate how confident you feel about "Macbeth Act 1 Analysis" and what you will revise
          next. (50-70 words)
        checklist:
          - I identified one strength
          - I identified one area to improve
          - I suggested a specific next step
        minWords: 40
