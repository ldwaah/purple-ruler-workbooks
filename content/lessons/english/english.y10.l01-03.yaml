id: english.y10.l01-03
subject: english
year: 10
block: inspector-paper1
blockTitle: An Inspector Calls and Paper 1 Language Skills
lessonUnits: 1-3
examBoard: AQA
title: An Inspector Calls - Context
lessonsPerWeek: 3
unitAim: Understand and analyse the social, historical, and cultural context of An Inspector Calls.
objectives:
  - Understand social, historical, and cultural context
  - Explain Priestley's intentions and 1912 vs 1945
  - Compare attitudes across time periods
sections:
  - type: connect
    title: Connect to your lesson
    items:
      - type: info
        id: en1013-c1
        prompt: What we covered in your Purple Ruler lesson
        content: >-
          Lessons 1-3 focus on An Inspector Calls - Context. Understand and analyse the social, historical, and cultural
          context of An Inspector Calls. Use this workbook after your live lesson to consolidate that learning.
  - type: practice
    title: Practice
    items:
      - type: mcq
        id: en1013-p1
        prompt: Which statement best matches the focus of "An Inspector Calls - Context"?
        options:
          - Understand social, historical, and cultural context
          - Memorising quotations without analysis
          - Ignoring historical and social context
          - Writing without planning or evidence
        answer: Understand social, historical, and cultural context
        scaffold: Think back to your lesson objectives and key terminology.
      - type: short_text
        id: en1013-p2
        prompt: In one or two sentences, explain a key idea from An Inspector Calls - Context.
        keywords:
          - inspector
          - calls
          - context
        scaffold: A key idea from An Inspector Calls - Context is...
        exemplar: >-
          Understand social, historical, and cultural context. This helps you analyse the text with clear, supported
          ideas.
      - type: mcq
        id: en1013-p3
        prompt: Which skill is most important for GCSE English success in this unit?
        options:
          - Using evidence and subject terminology
          - Copying the plot with no analysis
          - Avoiding context completely
          - Writing without checking accuracy
        answer: Using evidence and subject terminology
      - type: ordering
        id: en1013-p4
        prompt: 'Put these steps for a strong analytical paragraph in the best order:'
        options:
          - State a clear point linked to the question
          - Select a relevant quotation or reference
          - Explain the writer's method and effect
          - Link back to the question or theme
        answer:
          - State a clear point linked to the question
          - Select a relevant quotation or reference
          - Explain the writer's method and effect
          - Link back to the question or theme
  - type: check
    title: Check your understanding
    items:
      - type: multi_select
        id: en1013-ch1
        prompt: 'Select ALL objectives linked to An Inspector Calls - Context:'
        options:
          - Understand social, historical, and cultural context
          - Explain Priestley's intentions and 1912 vs 1945
          - Compare attitudes across time periods
          - Ignore audience and purpose
          - Skip planning entirely
        answer:
          - Understand social, historical, and cultural context
          - Explain Priestley's intentions and 1912 vs 1945
          - Compare attitudes across time periods
      - type: short_text
        id: en1013-ch2
        prompt: Name one subject term you should use when writing about this unit.
        keywords:
          - context
          - theme
          - method
          - structure
          - language
          - audience
          - purpose
          - character
        exemplar: Use terms such as context, theme, structure, or writer's methods with precise evidence.
      - type: mcq
        id: en1013-ch3
        prompt: 'After your live lesson, this workbook helps you to:'
        options:
          - Consolidate and practise what you learned
          - Replace all reading of the set texts
          - Skip reflection on your work
          - Avoid using feedback from teachers
        answer: Consolidate and practise what you learned
  - type: reflect
    title: Reflect
    items:
      - type: long_text
        id: en1013-rf1
        prompt: >-
          Write about 40-60 words: what did you learn in An Inspector Calls - Context, and what do you still need to
          practise?
        scaffold: In An Inspector Calls - Context, I learned... I still need to practise...
        checklist:
          - I named a specific skill or idea from the lesson
          - I gave an example from the text or task
          - I identified one next step for improvement
        minWords: 30
        exemplar: >-
          In An Inspector Calls - Context, I learned how to link context to the writer's purpose. I still need to
          practise selecting shorter, sharper quotations and explaining their effect in more detail.
  - type: stretch
    title: Stretch
    items:
      - type: long_text
        id: en1013-st1
        prompt: >-
          Stretch: write 50-80 words comparing two ideas from An Inspector Calls - Context. Which is more convincing and
          why?
        checklist:
          - Clear comparison between two ideas
          - Evidence or example from the unit
          - Evaluative judgement with justification
        minWords: 45
        exemplar: >-
          Both ideas are important, but linking context to theme is more convincing because it shows why the writer made
          choices for a real audience, not only what happens in the plot.
