id: english.y11.l25-28
subject: english
year: 11
block: poetry-y11
blockTitle: Power and Conflict and Unseen Poetry
lessonUnits: 25-28
examBoard: AQA
title: Anthology Poems 1-5 Analysis
lessonsPerWeek: 3
unitAim: Study and analyse selected poems from the Power and Conflict anthology.
objectives:
  - Detailed study and annotation of poems from both clusters
  - Identify themes and emotions in each poem
  - Analyse language, structure, and contextual background
sections:
  - type: connect
    title: Connect to your lesson
    items:
      - type: info
        id: en1110-c1
        prompt: What we covered in your Purple Ruler lesson
        content: >-
          Lesson 25-28 focused on anthology poems 1-5 analysis. You explored key ideas from Power
          and Conflict and Unseen Poetry and built skills linked to your GCSE English objectives.
          Use this workbook after your live lesson to consolidate that learning.
  - type: practice
    title: Practice
    items:
      - type: mcq
        id: en1110-p1
        prompt: Which objective best matches Lesson 25-28?
        options:
          - Detailed study and annotation of poems from both clusters
          - Memorise dates only without analysis
          - Ignore context when writing about texts
          - Skip planning before extended writing
        answer: Detailed study and annotation of poems from both clusters
        scaffold: Choose the aim that matches what you practised in the live lesson.
      - type: short_text
        id: en1110-p2
        prompt: In one or two sentences, explain a key idea from "Anthology Poems 1-5 Analysis".
        keywords:
          - understand
          - analyse
          - explain
          - context
          - theme
          - character
          - language
          - structure
        exemplar: Detailed study and annotation of poems from both clusters
      - type: ordering
        id: en1110-p3
        prompt: 'Order these study skills from first step to final step:'
        options:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
        answer:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
      - type: mcq
        id: en1110-p4
        prompt: Which skill is most important for Power work in this unit?
        options:
          - Using evidence to support ideas
          - Ignoring the question focus
          - Copying text without comment
          - Avoiding subject terminology
        answer: Using evidence to support ideas
  - type: check
    title: Check your understanding
    items:
      - type: multi_select
        id: en1110-ch1
        prompt: 'Select ALL habits that strengthen GCSE English responses:'
        options:
          - Clear topic sentences
          - Evidence from the text
          - Ignoring the question
          - Checking for accurate terminology
        answer:
          - Clear topic sentences
          - Evidence from the text
          - Checking for accurate terminology
      - type: short_text
        id: en1110-ch2
        prompt: Name one subject term you should use when writing about this unit.
        keywords:
          - context
          - theme
          - structure
          - language
          - audience
          - purpose
          - character
          - analysis
        exemplar: Use precise terminology such as context, theme, or structure.
      - type: mcq
        id: en1110-ch3
        prompt: What should you do first when answering an extended question?
        options:
          - Plan your main points
          - Write the conclusion first
          - Copy the question as your answer
          - Skip reading the text
        answer: Plan your main points
  - type: reflect
    title: Reflect
    items:
      - type: long_text
        id: en1110-rf1
        prompt: Write a short paragraph (about 40-60 words) explaining what you learned in Lesson 25-28.
        scaffold: In Lesson 25-28, I learned that...
        checklist:
          - I stated the main idea from the lesson
          - I used at least one piece of subject terminology
          - I linked my learning to the unit aim
        exemplar: Study and analyse selected poems from the Power and Conflict anthology.
        minWords: 30
  - type: stretch
    title: Stretch
    items:
      - type: long_text
        id: en1110-st1
        prompt: >-
          Evaluate how confident you feel about "Anthology Poems 1-5 Analysis" and what you will
          revise next. (50-70 words)
        checklist:
          - I identified one strength
          - I identified one area to improve
          - I suggested a specific next step
        minWords: 40
