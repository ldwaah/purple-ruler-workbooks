id: english.y10.l71
subject: english
year: 10
block: macbeth-paper2
blockTitle: Macbeth and Paper 2 Language Skills
lessonUnits: '71'
examBoard: AQA
title: Analysing Language and Structure
lessonsPerWeek: 3
unitAim: Practise analysing the language and structure of texts.
objectives:
  - Identify literary devices and their effects
  - Analyse how authors use language to convey meaning
  - Compare structure and its impact across texts
sections:
  - type: connect
    title: Connect to your lesson
    items:
      - type: info
        id: en1044-c1
        prompt: What we covered in your Purple Ruler lesson
        content: >-
          Lesson 71 focused on analysing language and structure. You explored key ideas from Macbeth
          and Paper 2 Language Skills and built skills linked to your GCSE English objectives. Use
          this workbook after your live lesson to consolidate that learning.
  - type: practice
    title: Practice
    items:
      - type: mcq
        id: en1044-p1
        prompt: Which objective best matches Lesson 71?
        options:
          - Identify literary devices and their effects
          - Memorise dates only without analysis
          - Ignore context when writing about texts
          - Skip planning before extended writing
        answer: Identify literary devices and their effects
        scaffold: Choose the aim that matches what you practised in the live lesson.
      - type: short_text
        id: en1044-p2
        prompt: In one or two sentences, explain a key idea from "Analysing Language and Structure".
        keywords:
          - understand
          - analyse
          - explain
          - context
          - theme
          - character
          - language
          - structure
        exemplar: Identify literary devices and their effects
      - type: ordering
        id: en1044-p3
        prompt: 'Order these study skills from first step to final step:'
        options:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
        answer:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
      - type: mcq
        id: en1044-p4
        prompt: Which skill is most important for Macbeth work in this unit?
        options:
          - Using evidence to support ideas
          - Ignoring the question focus
          - Copying text without comment
          - Avoiding subject terminology
        answer: Using evidence to support ideas
  - type: check
    title: Check your understanding
    items:
      - type: multi_select
        id: en1044-ch1
        prompt: 'Select ALL habits that strengthen GCSE English responses:'
        options:
          - Clear topic sentences
          - Evidence from the text
          - Ignoring the question
          - Checking for accurate terminology
        answer:
          - Clear topic sentences
          - Evidence from the text
          - Checking for accurate terminology
      - type: short_text
        id: en1044-ch2
        prompt: Name one subject term you should use when writing about this unit.
        keywords:
          - context
          - theme
          - structure
          - language
          - audience
          - purpose
          - character
          - analysis
        exemplar: Use precise terminology such as context, theme, or structure.
      - type: mcq
        id: en1044-ch3
        prompt: What should you do first when answering an extended question?
        options:
          - Plan your main points
          - Write the conclusion first
          - Copy the question as your answer
          - Skip reading the text
        answer: Plan your main points
  - type: reflect
    title: Reflect
    items:
      - type: long_text
        id: en1044-rf1
        prompt: Write a short paragraph (about 40-60 words) explaining what you learned in Lesson 71.
        scaffold: In Lesson 71, I learned that...
        checklist:
          - I stated the main idea from the lesson
          - I used at least one piece of subject terminology
          - I linked my learning to the unit aim
        exemplar: Practise analysing the language and structure of texts.
        minWords: 30
  - type: stretch
    title: Stretch
    items:
      - type: long_text
        id: en1044-st1
        prompt: >-
          Evaluate how confident you feel about "Analysing Language and Structure" and what you will
          revise next. (50-70 words)
        checklist:
          - I identified one strength
          - I identified one area to improve
          - I suggested a specific next step
        minWords: 40
