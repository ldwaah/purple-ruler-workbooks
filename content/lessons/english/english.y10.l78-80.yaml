id: english.y10.l78-80
subject: english
year: 10
block: year-review
blockTitle: Literature and Language Review
lessonUnits: 78-80
examBoard: AQA
title: Comparative Analysis - Power and Conflict
lessonsPerWeek: 3
unitAim: Develop comparative analysis skills across anthology poems.
objectives:
  - Compare themes and techniques across poems
  - Write comparative essays with clear thesis statements
  - Support arguments with specific textual evidence
sections:
  - type: connect
    title: Connect to your lesson
    items:
      - type: info
        id: en1047-c1
        prompt: What we covered in your Purple Ruler lesson
        content: >-
          Lesson 78-80 focused on comparative analysis - power and conflict. You explored key ideas
          from Literature and Language Review and built skills linked to your GCSE English
          objectives. Use this workbook after your live lesson to consolidate that learning.
  - type: practice
    title: Practice
    items:
      - type: mcq
        id: en1047-p1
        prompt: Which objective best matches Lesson 78-80?
        options:
          - Compare themes and techniques across poems
          - Memorise dates only without analysis
          - Ignore context when writing about texts
          - Skip planning before extended writing
        answer: Compare themes and techniques across poems
        scaffold: Choose the aim that matches what you practised in the live lesson.
      - type: short_text
        id: en1047-p2
        prompt: >-
          In one or two sentences, explain a key idea from "Comparative Analysis - Power and
          Conflict".
        keywords:
          - understand
          - analyse
          - explain
          - context
          - theme
          - character
          - language
          - structure
        exemplar: Compare themes and techniques across poems
      - type: ordering
        id: en1047-p3
        prompt: 'Order these study skills from first step to final step:'
        options:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
        answer:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
      - type: mcq
        id: en1047-p4
        prompt: Which skill is most important for Literature work in this unit?
        options:
          - Using evidence to support ideas
          - Ignoring the question focus
          - Copying text without comment
          - Avoiding subject terminology
        answer: Using evidence to support ideas
  - type: check
    title: Check your understanding
    items:
      - type: multi_select
        id: en1047-ch1
        prompt: 'Select ALL habits that strengthen GCSE English responses:'
        options:
          - Clear topic sentences
          - Evidence from the text
          - Ignoring the question
          - Checking for accurate terminology
        answer:
          - Clear topic sentences
          - Evidence from the text
          - Checking for accurate terminology
      - type: short_text
        id: en1047-ch2
        prompt: Name one subject term you should use when writing about this unit.
        keywords:
          - context
          - theme
          - structure
          - language
          - audience
          - purpose
          - character
          - analysis
        exemplar: Use precise terminology such as context, theme, or structure.
      - type: mcq
        id: en1047-ch3
        prompt: What should you do first when answering an extended question?
        options:
          - Plan your main points
          - Write the conclusion first
          - Copy the question as your answer
          - Skip reading the text
        answer: Plan your main points
  - type: reflect
    title: Reflect
    items:
      - type: long_text
        id: en1047-rf1
        prompt: Write a short paragraph (about 40-60 words) explaining what you learned in Lesson 78-80.
        scaffold: In Lesson 78-80, I learned that...
        checklist:
          - I stated the main idea from the lesson
          - I used at least one piece of subject terminology
          - I linked my learning to the unit aim
        exemplar: Develop comparative analysis skills across anthology poems.
        minWords: 30
  - type: stretch
    title: Stretch
    items:
      - type: long_text
        id: en1047-st1
        prompt: >-
          Evaluate how confident you feel about "Comparative Analysis - Power and Conflict" and what
          you will revise next. (50-70 words)
        checklist:
          - I identified one strength
          - I identified one area to improve
          - I suggested a specific next step
        minWords: 40
