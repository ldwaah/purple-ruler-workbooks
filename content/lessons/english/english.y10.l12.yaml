id: english.y10.l12
subject: english
year: 10
block: inspector-paper1
blockTitle: An Inspector Calls and Paper 1 Language Skills
lessonUnits: '12'
examBoard: AQA
title: Character Studies and Development
lessonsPerWeek: 3
unitAim: Examine the development and motivations of key characters.
objectives:
  - Trace character evolution in the Birling family and Inspector Goole
  - Explore what drives each character's actions
  - Analyse how motivations are challenged by the investigation
sections:
  - type: connect
    title: Connect to your lesson
    items:
      - type: info
        id: en1006-c1
        prompt: What we covered in your Purple Ruler lesson
        content: >-
          Lesson 12 focused on character studies and development. You explored key ideas from An
          Inspector Calls and Paper 1 Language Skills and built skills linked to your GCSE English
          objectives. Use this workbook after your live lesson to consolidate that learning.
  - type: practice
    title: Practice
    items:
      - type: mcq
        id: en1006-p1
        prompt: Which objective best matches Lesson 12?
        options:
          - Trace character evolution in the Birling family and Inspector Goole
          - Memorise dates only without analysis
          - Ignore context when writing about texts
          - Skip planning before extended writing
        answer: Trace character evolution in the Birling family and Inspector Goole
        scaffold: Choose the aim that matches what you practised in the live lesson.
      - type: short_text
        id: en1006-p2
        prompt: In one or two sentences, explain a key idea from "Character Studies and Development".
        keywords:
          - understand
          - analyse
          - explain
          - context
          - theme
          - character
          - language
          - structure
        exemplar: Trace character evolution in the Birling family and Inspector Goole
      - type: ordering
        id: en1006-p3
        prompt: 'Order these study skills from first step to final step:'
        options:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
        answer:
          - Review the lesson objective
          - Collect evidence or examples
          - Plan your response
          - Write and check your answer
      - type: mcq
        id: en1006-p4
        prompt: Which skill is most important for An work in this unit?
        options:
          - Using evidence to support ideas
          - Ignoring the question focus
          - Copying text without comment
          - Avoiding subject terminology
        answer: Using evidence to support ideas
  - type: check
    title: Check your understanding
    items:
      - type: multi_select
        id: en1006-ch1
        prompt: 'Select ALL habits that strengthen GCSE English responses:'
        options:
          - Clear topic sentences
          - Evidence from the text
          - Ignoring the question
          - Checking for accurate terminology
        answer:
          - Clear topic sentences
          - Evidence from the text
          - Checking for accurate terminology
      - type: short_text
        id: en1006-ch2
        prompt: Name one subject term you should use when writing about this unit.
        keywords:
          - context
          - theme
          - structure
          - language
          - audience
          - purpose
          - character
          - analysis
        exemplar: Use precise terminology such as context, theme, or structure.
      - type: mcq
        id: en1006-ch3
        prompt: What should you do first when answering an extended question?
        options:
          - Plan your main points
          - Write the conclusion first
          - Copy the question as your answer
          - Skip reading the text
        answer: Plan your main points
  - type: reflect
    title: Reflect
    items:
      - type: long_text
        id: en1006-rf1
        prompt: Write a short paragraph (about 40-60 words) explaining what you learned in Lesson 12.
        scaffold: In Lesson 12, I learned that...
        checklist:
          - I stated the main idea from the lesson
          - I used at least one piece of subject terminology
          - I linked my learning to the unit aim
        exemplar: Examine the development and motivations of key characters.
        minWords: 30
  - type: stretch
    title: Stretch
    items:
      - type: long_text
        id: en1006-st1
        prompt: >-
          Evaluate how confident you feel about "Character Studies and Development" and what you
          will revise next. (50-70 words)
        checklist:
          - I identified one strength
          - I identified one area to improve
          - I suggested a specific next step
        minWords: 40
